<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>EXIF 水印 · 本地离线版</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111'/%3E%3Crect x='6' y='9' width='20' height='14' rx='3' fill='none' stroke='%23d9f95a' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23d9f95a'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#08080a; --panel:#0f0f12; --card:#151518; --card2:#1a1a1e;
    --line:rgba(255,255,255,.075); --line2:rgba(255,255,255,.14);
    --ink:#ececef; --muted:#8b8b94; --accent:#d9f95a; --accent-ink:#0b0b0c;
    --radius:10px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink); overflow-x:hidden;
    font:13px/1.5 "Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button,input,select{font:inherit;color:inherit}
  [hidden]{display:none!important}
  code{font-family:Consolas,monospace;font-size:11px;color:#a8a8b0}

  /* 顶栏 */
  .top{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;
    border-bottom:1px solid var(--line);background:rgba(9,9,11,.92);position:-webkit-sticky;position:sticky;top:0;z-index:20}
  .logo{display:flex;align-items:center;font-weight:650;letter-spacing:.2px}
  .logo .dot{width:9px;height:9px;border-radius:2px;background:var(--accent);box-shadow:0 0 12px rgba(217,249,90,.55);margin-right:9px}
  .logo em{font-style:normal;font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.08em}
  .top-actions{display:flex}
  .top-actions .btn + .btn{margin-left:8px}

  .btn{height:34px;padding:0 14px;touch-action:manipulation;border-radius:8px;border:1px solid var(--line2);background:#17171a;cursor:pointer;transition:.15s;white-space:nowrap}
  .btn:hover{background:#1f1f24;border-color:rgba(255,255,255,.22)}
  .btn.solid{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:650}
  .btn.solid:hover{filter:brightness(1.06)}
  .btn:disabled{opacity:.38;cursor:not-allowed}
  .btn.wide{width:100%;height:42px;margin-top:6px}

  /* 主体 */
  .app{display:flex;height:calc(100vh - 54px)}
  .stage{flex:1 1 auto}
  .panel{flex:0 0 400px;width:400px}
  .stage{position:relative;display:flex;align-items:center;justify-content:center;padding:30px;min-width:0;overflow:hidden;
    background:radial-gradient(900px 500px at 50% 0%,rgba(255,255,255,.045),transparent 70%),#0a0a0c}
  .stage::before{content:"";position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;
    background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
    background-size:44px 44px;-webkit-mask-image:radial-gradient(70% 60% at 50% 45%,#000 30%,transparent 100%);mask-image:radial-gradient(70% 60% at 50% 45%,#000 30%,transparent 100%)}
  .stage.drag{outline:1px dashed rgba(217,249,90,.55);outline-offset:-14px}
  #preview{display:block;margin:auto;max-width:100%;max-height:calc(100vh - 200px);width:auto;height:auto;border-radius:2px;
    box-shadow:0 28px 70px rgba(0,0,0,.62),0 0 0 1px rgba(255,255,255,.05);position:relative;z-index:1}
  .empty{position:relative;z-index:1;width:min(430px,100%);padding:44px 26px;text-align:center;cursor:pointer;
    border:1px dashed rgba(255,255,255,.16);border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,.008));transition:.18s}
  .empty:hover{border-color:rgba(217,249,90,.45);background:rgba(217,249,90,.03)}
  .empty .ico{width:52px;height:52px;margin:0 auto 14px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:300;
    background:#16161a;border:1px solid var(--line2);color:var(--accent)}
  .empty h2{margin:0 0 6px;font-size:15px;font-weight:600}
  .empty p{margin:0;color:var(--muted);font-size:12px}
  .stage-foot{position:absolute;left:22px;bottom:16px;z-index:2;font-size:11.5px;color:var(--muted);
    display:flex;align-items:center}
  .stage-foot > * + *{margin-left:8px}
  .stage-foot .sep{opacity:.35}
  .stage-foot .ok{color:var(--accent);opacity:.85}

  /* 面板 */
  .panel{border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:16px 16px 30px;scrollbar-width:thin}
  .panel::-webkit-scrollbar{width:8px}
  .panel::-webkit-scrollbar-thumb{background:#26262c;border-radius:8px}
  .sec{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 9px;font-weight:600}
  section{margin-bottom:18px}
  .sec-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
  .sec-row .sec{margin:0}
  .count{font-size:10.5px;color:#5f5f68}
  .mini{background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer;padding:2px 4px;border-radius:4px}
  .mini:hover{color:var(--accent);background:rgba(217,249,90,.07)}

  .sel{width:100%;height:32px;padding:0 9px;border-radius:7px;background:#0b0b0e;border:1px solid var(--line);outline:none}
  .sel:focus{border-color:rgba(217,249,90,.45)}
  .btnrow{display:flex;margin-top:7px;flex-wrap:wrap}
  .btnrow > * + *{margin-left:6px}
  .mini-btn{flex:1;height:28px;min-width:64px;border-radius:6px;border:1px solid var(--line);background:#15151a;color:#c9c9d0;
    font-size:11.5px;cursor:pointer;transition:.15s}
  .mini-btn:hover{background:#1d1d23;border-color:var(--line2);color:#fff}
  .mini-btn.danger:hover{color:#ff9a9a;border-color:rgba(255,120,120,.4)}

  /* 模板 */
  .tpls{display:flex;flex-wrap:wrap;margin-right:-7px}
  .tpls > *{width:calc(50% - 7px);margin:0 7px 7px 0}
  .tpl{text-align:left;padding:6px;border-radius:9px;cursor:pointer;background:var(--card);border:1px solid var(--line);transition:.15s;color:var(--ink)}
  .tpl:hover{background:var(--card2);border-color:var(--line2)}
  .tpl.is-on{border-color:rgba(217,249,90,.6);background:rgba(217,249,90,.055);box-shadow:0 0 0 1px rgba(217,249,90,.18) inset}
  .th{position:relative;display:block;height:44px;border-radius:5px;overflow:hidden;background:#0b0b0d;border:1px solid rgba(255,255,255,.06);margin-bottom:6px}
  .th .p{position:absolute;background:linear-gradient(140deg,#4b5460,#252a33 45%,#5a4a3c)}
  .th .b{position:absolute;background:#fff}
  .tpl[data-tpl="bar"] .th .p{top:0;right:0;bottom:8px;left:0}
  .tpl[data-tpl="bar"] .th .b{left:0;right:0;bottom:0;height:8px}
  .tpl[data-tpl="dark"] .th .p{top:0;right:0;bottom:8px;left:0}
  .tpl[data-tpl="dark"] .th .b{left:0;right:0;bottom:0;height:8px;background:#0c0c0e}
  .tpl[data-tpl="center"] .th .p{top:0;right:0;bottom:0;left:0}
  .tpl[data-tpl="center"] .th .b{left:50%;bottom:9px;width:20px;height:3px;margin-left:-10px;background:#fff;border-radius:1px}
  .tpl[data-tpl="corner"] .th .p{top:0;right:0;bottom:0;left:0}
  .tpl[data-tpl="corner"] .th .b{left:6px;bottom:9px;width:18px;height:3px;background:#fff;border-radius:1px}
  .tpl[data-tpl="wordmark"] .th .p{top:0;right:0;bottom:0;left:0}
  .tpl[data-tpl="wordmark"] .th .b{left:50%;bottom:8px;width:30px;height:6px;margin-left:-15px;background:#fff;border-radius:1px}
  .tpl[data-tpl="film"] .th{background:#f3f0e9}
  .tpl[data-tpl="film"] .th .p{top:4px;right:4px;bottom:12px;left:4px}
  .tname{display:block;font-size:12px;font-weight:600}
  .tdesc{display:block;font-size:10px;color:var(--muted);margin-top:1px}

  /* 表单 */
  .grid2{display:flex;flex-wrap:wrap;margin-right:-7px}
  .grid2 > *{width:calc(50% - 7px);margin:0 7px 7px 0}
  label{display:block}
  label span,.lab{display:block;font-size:10.5px;color:var(--muted);margin-bottom:4px;letter-spacing:.03em}
  input[type=text],input[type=password]{width:100%;height:32px;padding:0 9px;border-radius:7px;background:#0b0b0e;border:1px solid var(--line);outline:none;transition:.15s}
  input[type=text]:focus{border-color:rgba(217,249,90,.5);background:#0d0d10}
  input::placeholder{color:#54545c}
  .full{display:block;margin-top:7px}

  .row{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
  .row > * + *{margin-left:10px}
  .row>span{font-size:12px;color:#b6b6bd}
  .seg{display:flex;background:#0b0b0e;border:1px solid var(--line);border-radius:7px;padding:2px}
  .seg button{background:none;border:none;padding:3px 10px;border-radius:5px;font-size:11.5px;color:var(--muted);cursor:pointer}
  .seg button.on{background:#24242a;color:var(--ink)}

  .switch{position:relative;display:inline-block;width:34px;height:19px;flex:none}
  .switch input{opacity:0;width:0;height:0;position:absolute}
  .switch span{position:absolute;top:0;right:0;bottom:0;left:0;background:#222228;border:1px solid var(--line2);border-radius:20px;transition:.18s;display:block}
  .switch span::after{content:"";position:absolute;left:2px;top:2px;width:13px;height:13px;border-radius:50%;background:#8a8a92;transition:.18s}
  .switch input:checked+span{background:rgba(217,249,90,.18);border-color:rgba(217,249,90,.55)}
  .switch input:checked+span::after{transform:translateX(15px);background:var(--accent)}

  .sld{margin-bottom:11px;touch-action:pan-y}
  .sld .sld-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
  .sld .sld-top span{font-size:12px;color:#b6b6bd}
  .sld output{font-size:11px;color:var(--ink);font-variant-numeric:tabular-nums}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:none;cursor:pointer;
    touch-action:pan-y;-ms-touch-action:pan-y;-webkit-user-select:none;user-select:none}
  input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:#26262c}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--accent);margin-top:-4.5px;box-shadow:0 0 0 3px rgba(217,249,90,.12)}
  input[type=range]::-moz-range-track{height:3px;border-radius:3px;background:#26262c}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;border:none;border-radius:50%;background:var(--accent)}

  .logo-chips{display:flex;margin-top:8px;flex-wrap:wrap}
  .logo-chips > * + *{margin-left:6px}
  .chip{height:27px;padding:0 12px;border-radius:14px;border:1px solid var(--line);background:#121216;
    color:#b9b9c1;font-size:11.5px;cursor:pointer;transition:.15s}
  .chip:hover{border-color:var(--line2);color:#fff;background:#17171c}
  .chip.is-on{border-color:rgba(217,249,90,.55);background:rgba(217,249,90,.1);color:var(--accent)}
  .logo-name{font-size:10.5px;color:#6a6a73;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hint{font-size:10.5px;color:#66656e;margin:8px 0 0;line-height:1.6}
  .foot-note{font-size:10.5px;color:#5c5b64;border-top:1px solid var(--line);padding-top:11px;margin-top:6px;line-height:1.7}

  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);background:#1c1c21;border:1px solid var(--line2);
    color:var(--ink);padding:9px 16px;border-radius:9px;font-size:12px;opacity:0;pointer-events:none;transition:.22s;z-index:99;
    box-shadow:0 12px 30px rgba(0,0,0,.5);max-width:80vw;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  body.clean .top,body.clean .panel{display:none!important}
  body.clean .app{grid-template-columns:1fr;height:100vh}
  body.clean .stage{padding:0;background:#0a0a0c}
  body.clean #preview{max-height:100vh;max-width:100vw;border-radius:0;box-shadow:none}
  body.clean .stage-foot{display:none}

  @media (max-width:900px){
    .app{flex-direction:column;height:auto}
    .stage{min-height:44vh;padding:18px;order:1;width:100%;box-sizing:border-box}
    #preview{max-height:40vh}
    .panel{border-left:none;border-top:1px solid var(--line);order:2;padding:16px 14px 40px;flex:1 1 auto;width:auto}
    .stage-foot{position:static;margin-top:14px;justify-content:center}
  }
</style>
</head>
<body>
<noscript>
  <div style="position:fixed;top:0;right:0;bottom:0;left:0;z-index:9999;background:#0b0b0c;color:#d9f95a;
              font:16px/1.7 'Microsoft YaHei',sans-serif;padding:40px 24px;text-align:center">
    <p style="font-size:20px;font-weight:700;margin:0 0 10px">这个查看器禁用了 JavaScript</p>
    <p style="margin:0;color:#bbb">页面能显示，但所有按钮都不会工作。<br>
       请用 Chrome、夸克或 QQ 浏览器打开本文件。</p>
  </div>
</noscript>

<header class="top">
  <div class="logo"><span class="dot"></span>EXIF 水印 <em>本地 · 离线</em></div>
  <div class="top-actions">
    <button class="btn" id="pickBtn">选择图片</button>
    <button class="btn solid" id="exportBtn" disabled>导出</button>
  </div>
</header>

<div class="app">
  <main class="stage" id="stage">
    <div class="empty" id="empty">
      <div class="ico">＋</div>
      <h2>拖入照片，或点击选择</h2>
      <p>JPG / PNG / WebP · 自动读取 EXIF</p>
    </div>
    <canvas id="preview" hidden></canvas>
    <div class="stage-foot" id="meta" hidden></div>
  </main>

  <aside class="panel">

    <section>
      <div class="sec-row"><h3 class="sec">预设</h3><span class="count" id="presetCount"></span></div>
      <select id="presetSel" class="sel"></select>
      <div class="btnrow">
        <button class="mini-btn" id="presetSave" title="覆盖保存当前预设">保存</button>
        <button class="mini-btn" id="presetSaveAs">另存为</button>
        <button class="mini-btn" id="presetRename">重命名</button>
        <button class="mini-btn danger" id="presetDel">删除</button>
      </div>
      <div class="btnrow">
        <button class="mini-btn" id="presetExport">导出备份</button>
        <button class="mini-btn" id="presetImport">导入备份</button>
        <input type="file" id="presetFile" accept=".json,application/json" hidden>
      </div>
    </section>

    <section>
      <h3 class="sec">模板</h3>
      <div class="tpls" id="tpls">
        <button class="tpl is-on" data-tpl="bar"><span class="th"><i class="p"></i><i class="b"></i></span><span class="tname">白条</span><span class="tdesc">华为 / 徕卡风</span></button>
        <button class="tpl" data-tpl="dark"><span class="th"><i class="p"></i><i class="b"></i></span><span class="tname">黑条</span><span class="tdesc">暗底参数条</span></button>
        <button class="tpl" data-tpl="center"><span class="th"><i class="p"></i><i class="b"></i></span><span class="tname">居中</span><span class="tdesc">图标在上</span></button>
        <button class="tpl" data-tpl="corner"><span class="th"><i class="p"></i><i class="b"></i></span><span class="tname">左下</span><span class="tdesc">角标署名</span></button>
        <button class="tpl" data-tpl="wordmark"><span class="th"><i class="p"></i><i class="b"></i></span><span class="tname">大字</span><span class="tdesc">品牌主视觉</span></button>
        <button class="tpl" data-tpl="film"><span class="th"><i class="p"></i><i class="b"></i></span><span class="tname">胶片</span><span class="tdesc">画框留边</span></button>
      </div>
    </section>

    <section>
      <div class="sec-row"><h3 class="sec">品牌与设备</h3><button class="mini" id="reloadBtn">重读 EXIF</button></div>
      <div class="grid2">
        <label><span>品牌</span><input type="text" data-f="brand" placeholder="xiaomi"></label>
        <label><span>设备名</span><input type="text" data-f="model" placeholder="17 Ultra"></label>
      </div>
      <label class="full"><span>后缀（可选）</span><input type="text" data-f="suffix" placeholder="by Leica"></label>
      <div class="logo-chips" id="logoChips">
        <button class="chip is-on" data-kind="">无</button>
        <button class="chip" data-kind="leica">徕卡</button>
        <button class="chip" id="logoPick">上传</button>
      </div>
      <div class="logo-name" id="logoName">未设置 · 用文字品牌名</div>
      <input type="file" id="logoFile" accept="image/png,image/svg+xml,image/jpeg,image/webp" hidden>
    </section>

    <section>
      <h3 class="sec">拍摄参数</h3>
      <div class="grid2">
        <label><span>焦距</span><input type="text" data-f="focal" placeholder="35mm"></label>
        <label><span>光圈</span><input type="text" data-f="aperture" placeholder="f/1.8"></label>
        <label><span>快门</span><input type="text" data-f="shutter" placeholder="1/250s"></label>
        <label><span>ISO</span><input type="text" data-f="iso" placeholder="ISO 100"></label>
      </div>
    </section>

    <section>
      <h3 class="sec">时间与位置</h3>
      <div class="row"><span>显示拍摄时间</span><label class="switch"><input type="checkbox" id="dateSw" checked><span></span></label></div>
      <input type="text" data-f="date" placeholder="2024.05.01">
      <div class="row" style="margin-top:10px"><span>显示坐标</span><label class="switch"><input type="checkbox" id="locSw"><span></span></label></div>
      <input type="text" data-f="location" placeholder="31.2304°N, 121.4737°E">
    </section>

    <section>
      <h3 class="sec">署名 / 文案</h3>
      <input type="text" data-f="signature" placeholder="可选，例如：落落大方，喜乐常常">
    </section>

    <section>
      <h3 class="sec">外观</h3>
      <div class="sld" data-show="bar,dark">
        <div class="sld-top"><span>条高</span><output id="barOut">6.5%</output></div>
        <input type="range" id="bar" min="4" max="14" step="0.5" value="6.5">
      </div>
      <div class="sld" data-show="bar,dark">
        <div class="sld-top"><span>外边框</span><output id="borderOut">0.6%</output></div>
        <input type="range" id="border" min="0" max="2.5" step="0.1" value="0.6">
      </div>
      <div class="sld">
        <div class="sld-top"><span>图标大小</span><output id="logoOut">100%</output></div>
        <input type="range" id="logo" min="50" max="180" step="5" value="100">
      </div>
      <div class="sld">
        <div class="sld-top"><span>整体字号</span><output id="fontOut">100%</output></div>
        <input type="range" id="font" min="80" max="130" step="5" value="100">
      </div>
      <div class="sld" data-show="center">
        <div class="sld-top"><span>垂直位置</span><output id="posOut">75</output></div>
        <input type="range" id="pos" min="0" max="100" step="5" value="75">
      </div>
      <div class="row">
        <span>文字颜色</span>
        <div class="seg" id="inkSeg">
          <button data-v="auto" class="on">自动</button>
          <button data-v="white">白</button>
          <button data-v="black">黑</button>
        </div>
      </div>
    </section>

    <section>
      <h3 class="sec">导出</h3>
      <div class="row">
        <span>尺寸</span>
        <select id="exportSize" class="sel" style="width:118px">
          <option value="0">原图</option>
          <option value="3000">长边 3000</option>
          <option value="2048">长边 2048</option>
        </select>
      </div>
      <div class="row">
        <span>格式</span>
        <select id="format" class="sel" style="width:110px">
          <option value="jpeg">JPEG</option>
          <option value="png">PNG</option>
        </select>
      </div>
      <div class="sld">
        <div class="sld-top"><span>JPEG 质量</span><output id="qOut">92%</output></div>
        <input type="range" id="quality" min="60" max="100" value="92">
      </div>
      <button class="btn solid wide" id="exportBtn2" disabled>导出原图尺寸</button>
      <p class="hint">按原图分辨率重绘，输出尺寸随模板变化（加条/加边框）。点击导出会让你选择保存位置。</p>
      <p class="foot-note">照片、图标、预设都只存在本机浏览器里，不发任何网络请求。预设存在 localStorage，换电脑前记得「导出备份」。</p>
    </section>
  </aside>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  /* ================= 1. 常量与状态 ================= */
  var FONT = '"Segoe UI","SF Pro Text","PingFang SC","Microsoft YaHei",Arial,sans-serif';
  var HAS_LS = 'letterSpacing' in CanvasRenderingContext2D.prototype;
  var STORE_PRESET = 'exifwm.presets.v1';
  var STORE_AUTO = 'exifwm.autosave.v1';

  var DEF_FIELDS = {
    brand: '', model: '', suffix: '',
    focal: '', aperture: '', shutter: '', iso: '',
    date: '', location: '', signature: ''
  };
  var DEF_UI = {
    bar: 0.065, border: 0.006, logoScale: 1, font: 1,
    showDate: true, showLoc: false, ink: 'auto',
    format: 'jpeg', quality: 0.92, exportMax: 0, pos: 75
  };

  var state = {
    bitmap: null, file: null, fileName: '',
    template: 'bar',
    fields: clone(DEF_FIELDS),
    ui: clone(DEF_UI),
    logo: null, logoImg: null, logoKind: '',
    presets: [], currentPresetId: ''
  };

  var $ = function (s) { return document.querySelector(s); };
  var $$ = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
  var el = {
    stage: $('#stage'), empty: $('#empty'), preview: $('#preview'), meta: $('#meta'),
    file: $('#file'), toast: $('#toast'),
    exportBtn: $('#exportBtn'), exportBtn2: $('#exportBtn2')
  };

  /* ================= 2. 工具 ================= */
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  function toast(msg) {
    if (document.body.classList.contains('clean')) return;
    el.toast.textContent = msg;
    el.toast.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.toast.classList.remove('show'); }, 2400);
  }

  window.onerror = function (msg, src, line) {
    try { toast('脚本错误：' + msg + '（第 ' + line + ' 行）'); } catch (e) {}
    return false;
  };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function makeCanvas(w, h) {
    var c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w));
    c.height = Math.max(1, Math.round(h));
    return c;
  }

  function setFont(ctx, size, weight) {
    ctx.font = (weight || 400) + ' ' + size + 'px ' + FONT;
  }

  function measureAt(ctx, text, size, weight, spacing) {
    setFont(ctx, size, weight || 400);
    if (HAS_LS) ctx.letterSpacing = (spacing || 0) + 'px';
    var w = ctx.measureText(text).width;
    if (HAS_LS) ctx.letterSpacing = '0px';
    return w;
  }

  function drawT(ctx, text, x, y, o) {
    if (!text) return;
    setFont(ctx, o.size, o.weight || 400);
    ctx.fillStyle = o.color || '#000';
    ctx.textAlign = o.align || 'left';
    ctx.textBaseline = o.baseline || 'middle';
    if (HAS_LS) ctx.letterSpacing = (o.spacing || 0) + 'px';
    if (o.shadow) {
      ctx.shadowColor = o.shadow;
      ctx.shadowBlur = o.shadowBlur || o.size * 0.8;
      ctx.shadowOffsetY = o.shadowY || 0;
    }
    ctx.fillText(text, x, y);
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;
    if (HAS_LS) ctx.letterSpacing = '0px';
  }

  function drawCover(ctx, img, x, y, w, h) {
    var r = Math.max(w / img.width, h / img.height);
    var dw = img.width * r, dh = img.height * r;
    ctx.drawImage(img, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
  }

  function deviceName() {
    var f = state.fields;
    var parts = [f.brand, f.model].filter(Boolean);
    var s = parts.join(' ');
    if (f.suffix) s += ' ' + f.suffix;
    return s.trim();
  }

  function paramsLine() {
    var f = state.fields;
    return [f.focal, f.aperture, f.shutter, f.iso].filter(Boolean).join('   ');
  }

  function dateText() {
    return (state.ui.showDate && state.fields.date) ? state.fields.date : '';
  }

  function locText() {
    return (state.ui.showLoc && state.fields.location) ? state.fields.location : '';
  }

  /* ================= 3. EXIF 解析 ================= */
  function parseExif(buffer) {
    try {
      var v = new DataView(buffer), u = new Uint8Array(buffer);
      if (u[0] === 0xFF && u[1] === 0xD8) return exifFromJpeg(v, u);
      if (u[0] === 0x89 && u[1] === 0x50 && u[2] === 0x4E && u[3] === 0x47) return exifFromPng(v, u);
      if (u[0] === 0x52 && u[1] === 0x49 && u[2] === 0x46 && u[3] === 0x46) return exifFromWebp(v, u);
    } catch (e) { /* 没有 EXIF 就手动填 */ }
    return {};
  }

  function exifFromJpeg(v, u) {
    var off = 2;
    while (off + 4 < u.length) {
      if (u[off] !== 0xFF) { off++; continue; }
      var marker = u[off + 1];
      if (marker === 0xD8 || marker === 0x01 || (marker >= 0xD0 && marker <= 0xD7)) { off += 2; continue; }
      if (marker === 0xDA) break;
      var len = v.getUint16(off + 2);
      if (marker === 0xE1 && u[off + 4] === 0x45 && u[off + 5] === 0x78 &&
          u[off + 6] === 0x69 && u[off + 7] === 0x66) {
        return readTiff(v, off + 10);
      }
      off += 2 + len;
    }
    return {};
  }

  function exifFromPng(v, u) {
    var off = 8;
    while (off + 8 <= u.length) {
      var len = (u[off] << 24 | u[off + 1] << 16 | u[off + 2] << 8 | u[off + 3]) >>> 0;
      var type = String.fromCharCode(u[off + 4], u[off + 5], u[off + 6], u[off + 7]);
      if (type === 'eXIf') {
        var start = off + 8;
        if (u[start] === 0x45 && u[start + 1] === 0x78 && u[start + 2] === 0x69 && u[start + 3] === 0x66) start += 6;
        return readTiff(v, start);
      }
      if (type === 'IEND') break;
      off += 12 + len;
    }
    return {};
  }

  function exifFromWebp(v, u) {
    var off = 12;
    while (off + 8 <= u.length) {
      var type = String.fromCharCode(u[off], u[off + 1], u[off + 2], u[off + 3]);
      var len = v.getUint32(off + 4, true);
      if (type === 'EXIF') {
        var start = off + 8;
        if (u[start] === 0x45 && u[start + 1] === 0x78 && u[start + 2] === 0x69 && u[start + 3] === 0x66) start += 6;
        return readTiff(v, start);
      }
      off += 8 + len + (len % 2);
    }
    return {};
  }

  function readTiff(v, start) {
    if (start + 8 > v.byteLength) return {};
    var le = v.getUint16(start) === 0x4949;
    if (v.getUint16(start + 2, le) !== 42) return {};
    var ifd0 = start + v.getUint32(start + 4, le);

    function readIFD(off, map) {
      if (off <= 0 || off + 2 > v.byteLength) return;
      var n = v.getUint16(off, le);
      if (n > 500) return;
      for (var i = 0; i < n; i++) {
        var e = off + 2 + i * 12;
        if (e + 12 > v.byteLength) break;
        map[v.getUint16(e, le)] = { type: v.getUint16(e + 2, le), count: v.getUint32(e + 4, le), entry: e };
      }
    }

    function raw(map, tag) {
      var t = map[tag];
      if (!t) return null;
      var size = t.type === 3 ? 2 : t.type === 4 ? 4 : (t.type === 5 || t.type === 10) ? 8 : 1;
      var total = size * t.count;
      var base = total > 4 ? start + v.getUint32(t.entry + 8, le) : t.entry + 8;
      if (base < 0 || base + total > v.byteLength) return null;
      if (t.type === 2) {
        var s = '';
        for (var i = 0; i < t.count; i++) {
          var c = v.getUint8(base + i);
          if (c === 0) break;
          s += String.fromCharCode(c);
        }
        return s.trim();
      }
      if (t.type === 3) return v.getUint16(base, le);
      if (t.type === 4) return v.getUint32(base, le);
      if (t.type === 5) {
        var d = v.getUint32(base + 4, le);
        return d ? v.getUint32(base, le) / d : 0;
      }
      if (t.type === 10) {
        var d2 = v.getInt32(base + 4, le);
        return d2 ? v.getInt32(base, le) / d2 : 0;
      }
      if (t.type === 9) return v.getInt32(base, le);
      return null;
    }

    function rationals(map, tag) {
      var t = map[tag];
      if (!t || t.type !== 5 || t.count < 3) return null;
      var base = start + v.getUint32(t.entry + 8, le);
      var out = [];
      for (var i = 0; i < 3; i++) {
        var num = v.getUint32(base + i * 8, le), den = v.getUint32(base + i * 8 + 4, le);
        out.push(den ? num / den : 0);
      }
      return out;
    }

    function rationalOf(map, tag) {
      var t = map[tag];
      if (!t || t.type !== 5) return null;
      var base = start + v.getUint32(t.entry + 8, le);
      if (base + 8 > v.byteLength) return null;
      var num = v.getUint32(base, le), den = v.getUint32(base + 4, le);
      return den ? { num: num, den: den, val: num / den } : null;
    }

    var m0 = {}, m1 = {}, mg = {};
    readIFD(ifd0, m0);
    var exifPtr = m0[0x8769] ? v.getUint32(m0[0x8769].entry + 8, le) : 0;
    if (exifPtr) readIFD(start + exifPtr, m1);
    var gpsPtr = m0[0x8825] ? v.getUint32(m0[0x8825].entry + 8, le) : 0;
    if (gpsPtr) readIFD(start + gpsPtr, mg);

    var out = {};
    var ori = raw(m0, 0x0112);
    if (ori && ori >= 2 && ori <= 8) out.orientation = ori;

    var make = raw(m0, 0x010F), model = raw(m0, 0x0110);
    if (make) out.make = String(make).replace(/\0/g, '').trim();
    if (model) out.model = String(model).replace(/\0/g, '').trim();

    var lens = raw(m1, 0xA434);
    if (lens) out.lens = String(lens).replace(/\0/g, '').trim();

    var fn = rationalOf(m1, 0x829D);
    if (fn && fn.val > 0) out.aperture = 'f/' + trimNum(fn.val, 2);

    var et = rationalOf(m1, 0x829A);
    if (et) out.shutter = (et.num === 1 && et.den > 1) ? ('1/' + et.den + 's') : fmtShutter(et.val);

    var iso = raw(m1, 0x8827) || raw(m1, 0x8833);
    if (iso) out.iso = 'ISO ' + Math.round(iso);

    var fl = rationalOf(m1, 0x920A);
    if (fl && fl.val > 0) out.focal = trimNum(fl.val, 2) + 'mm';

    var dt = raw(m1, 0x9003) || raw(m0, 0x0132);
    if (dt) out.date = fmtDate(dt);

    var lat = rationals(mg, 2), lon = rationals(mg, 4);
    var latRef = raw(mg, 1), lonRef = raw(mg, 3);
    if (lat && lon) {
      var la = lat[0] + lat[1] / 60 + lat[2] / 3600;
      var lo = lon[0] + lon[1] / 60 + lon[2] / 3600;
      if (String(latRef).toUpperCase().indexOf('S') === 0) la = -la;
      if (String(lonRef).toUpperCase().indexOf('W') === 0) lo = -lo;
      out.gps = { lat: la, lon: lo };
    }
    return out;
  }

  function trimNum(x, digits) {
    if (!isFinite(x)) return '';
    var s = x.toFixed(digits);
    if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
    return s;
  }

  function fmtShutter(x) {
    if (!x) return '';
    if (x >= 1) return trimNum(x, 1) + 's';
    return '1/' + Math.round(1 / x) + 's';
  }

  function fmtDate(s) {
    var m = /^(\d{4})[:\-\.](\d{2})[:\-\.](\d{2})/.exec(String(s));
    return m ? m[1] + '.' + m[2] + '.' + m[3] : String(s);
  }

  function fmtGps(g) {
    var la = Math.abs(g.lat).toFixed(4) + '°' + (g.lat >= 0 ? 'N' : 'S');
    var lo = Math.abs(g.lon).toFixed(4) + '°' + (g.lon >= 0 ? 'E' : 'W');
    return la + ', ' + lo;
  }

  function stripBrand(model, brand) {
    if (!model) return '';
    var m = String(model).replace(/\s+/g, ' ').trim();
    if (!brand) return m;
    var b = String(brand).trim();
    if (m.toLowerCase().indexOf(b.toLowerCase()) === 0) {
      var rest = m.slice(b.length).replace(/^[\s\-]+/, '');
      return rest || m;
    }
    return m;
  }

  /* ================= 4. 颜色与图标 ================= */
  function autoInk() {
    if (state.ui.ink === 'white') return '#ffffff';
    if (state.ui.ink === 'black') return '#141414';
    if (!state.bitmap) return '#ffffff';

    // 只采样文字实际所在的横带：底部边缘（比如深色任务栏）不参与判断
    var band = {
      center:   [0.10, 0.74, 0.90, 0.955],
      corner:   [0.00, 0.72, 0.66, 0.970],
      wordmark: [0.12, 0.64, 0.88, 0.950]
    }[state.template] || [0.10, 0.74, 0.90, 0.95];

    var w = state.bitmap.width, h = state.bitmap.height;
    var sx = Math.floor(w * band[0]), sy = Math.floor(h * band[1]);
    var sw = Math.max(1, Math.floor(w * (band[2] - band[0])));
    var sh = Math.max(1, Math.floor(h * (band[3] - band[1])));

    var c = makeCanvas(28, 14);
    var x = c.getContext('2d');
    x.drawImage(state.bitmap, sx, sy, sw, sh, 0, 0, 28, 14);
    var d = x.getImageData(0, 0, 28, 14).data, sum = 0, n = 0;
    for (var i = 0; i < d.length; i += 4) {
      sum += 0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2];
      n++;
    }
    return (sum / (n * 255)) > 0.60 ? '#141414' : '#ffffff';
  }

  var leicaImg = null;

  function logoAspect() {
    if (state.logoKind === 'leica') return 1;
    if (state.logoImg) {
      var iw = state.logoImg.naturalWidth || state.logoImg.width || 0;
      var ih = state.logoImg.naturalHeight || state.logoImg.height || 0;
      return (iw && ih) ? iw / ih : 1;
    }
    return 0;
  }

  function drawLogo(ctx, x, cy, h, align) {
    var aspect = logoAspect();
    if (!aspect) return 0;
    var w = h * aspect;
    var dx = align === 'center' ? x - w / 2 : (align === 'right' ? x - w : x);
    if (state.logoKind === 'leica') {
      if (leicaImg) ctx.drawImage(leicaImg, dx, cy - h / 2, h, h);
    } else if (state.logoImg) {
      ctx.drawImage(state.logoImg, dx, cy - h / 2, w, h);
    }
    return w;
  }

  function logoW(h) { return h * logoAspect(); }

  function readArrayBuffer(blob) {
    return new Promise(function (resolve, reject) {
      if (blob && typeof blob.arrayBuffer === 'function') {
        blob.arrayBuffer().then(resolve, reject);
        return;
      }
      try {
        var fr = new FileReader();
        fr.onload = function () { resolve(fr.result); };
        fr.onerror = function () { reject(fr.error || new Error('read failed')); };
        fr.readAsArrayBuffer(blob);
      } catch (e) { reject(e); }
    });
  }

  function loadImage(src) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () { resolve(img); };
      img.onerror = reject;
      img.src = src;
    });
  }

  /* ================= 5. 模板绘制 ================= */
  function drawBar(ctx, g) {
    var f = state.fields, ui = state.ui;
    var darkTpl = g.tpl === 'dark';
    var ink = darkTpl ? '#f2f2f2' : '#141414';
    var nameInk = darkTpl ? 'rgba(242,242,242,.86)' : '#4a4a4a';
    var sub = darkTpl ? 'rgba(242,242,242,.52)' : 'rgba(20,20,20,.48)';
    var line = darkTpl ? 'rgba(255,255,255,.22)' : 'rgba(20,20,20,.16)';

    var cy = g.barTop + g.barH / 2;
    var padL = g.bd + g.iw * 0.035;
    var padR = g.cw - g.bd - g.iw * 0.035;

    var name = deviceName();
    var date = dateText();
    var params = paramsLine();
    var sig = f.signature || '';

    var nameS = g.barH * 0.30 * ui.font;
    var subS = g.barH * 0.185 * ui.font;
    var pS = g.barH * 0.285 * ui.font;

    // 右侧：图标 + 分隔线 + 参数
    var pH = g.barH * 0.50 * ui.logoScale;
    var pW = params ? measureAt(ctx, params, pS, 650) : 0;
    var lw = logoW(pH);
    var gap = g.barH * 0.24;
    var groupW = (lw ? lw + gap * 0.8 : 0) + (params ? pW : 0) + (lw && params ? gap * 0.7 : 0);
    var gx = padR - groupW;

    if (lw) {
      drawLogo(ctx, gx, cy, pH, 'left');
      gx += lw + gap * 0.8;
      if (params) {
        ctx.fillStyle = line;
        ctx.fillRect(Math.round(gx - gap * 0.35), Math.round(cy - g.barH * 0.22), Math.max(1, g.iw * 0.0012), Math.round(g.barH * 0.44));
      }
    }
    if (params) {
      var ps = pS;
      var maxW = padR - gx;
      if (pW > maxW && maxW > 10) ps = Math.max(pS * 0.5, ps * maxW / pW);
      drawT(ctx, params, gx, cy, { size: ps, weight: 650, color: ink });
    }

    // 左侧：设备名 + 日期/署名
    var leftMax = (groupW > 0 ? gx - gap * 1.2 : padR) - padL;
    var ns = nameS;
    if (name && leftMax > 10) {
      var nw = measureAt(ctx, name, ns, 500);
      if (nw > leftMax) ns = Math.max(nameS * 0.5, ns * leftMax / nw);
    }
    var l2 = [date, sig].filter(Boolean).join('   ');
    var nameY = l2 ? cy - g.barH * 0.17 : cy;
    var l2Y = cy + g.barH * 0.20;
    if (name) drawT(ctx, name, padL, nameY, { size: ns, weight: 500, color: nameInk });
    if (l2) drawT(ctx, l2, padL, l2Y, { size: subS, weight: 400, color: sub });
  }

  function drawCenter(ctx, g) {
    var f = state.fields, ui = state.ui;
    var ink = autoInk();
    var name = deviceName();
    var params = paramsLine();
    var date = dateText();
    var sig = f.signature || '';
    var shadow = ink === '#ffffff' ? 'rgba(0,0,0,.55)' : null;

    // 以下比例来自参考图实测（1080×1440）
    var lh = g.iw * 0.0546 * ui.logoScale;
    var nameS = g.iw * 0.0233 * ui.font;
    var pS = g.iw * 0.0172 * ui.font;
    var sS = g.iw * 0.016 * ui.font;

    var items = [];
    if (logoAspect() > 0) items.push({ type: 'logo', h: lh, gap: g.iw * 0.036 });
    if (name) items.push({ type: 'text', text: name, size: nameS, weight: 600, gap: g.iw * 0.013 });
    if (params || date) items.push({ type: 'line2', size: pS, gap: pS * 1.2 });
    if (sig) items.push({ type: 'text', text: sig, size: sS, weight: 400, gap: sS * 1.05 });

    // 末尾不加速度间距，避免整块被抬高
    var total = 0;
    items.forEach(function (it, i) {
      total += (it.h || it.size * 1.25) + (i < items.length - 1 ? it.gap : 0);
    });

    var pos = (typeof ui.pos === 'number') ? ui.pos : 75;
    var bottom = g.ih - g.iw * (0.037 - (pos - 50) / 50 * 0.025);
    var y = bottom - total;

    items.forEach(function (it, i) {
      var h = it.h || it.size * 1.25;
      var cy = y + h / 2;

      if (it.type === 'logo') {
        drawLogo(ctx, g.iw / 2, cy, it.h, 'center');
      } else if (it.type === 'line2') {
        // 参数用主色，日期用弱一档的颜色，视觉上分开
        var pw = params ? measureAt(ctx, params, it.size, 400) : 0;
        var dw = date ? measureAt(ctx, date, it.size * 0.92, 400) : 0;
        var sw = (params && date) ? measureAt(ctx, '   ', it.size, 400) : 0;
        var sx = g.iw / 2 - (pw + sw + dw) / 2;
        var dim = ink === '#ffffff' ? 'rgba(255,255,255,.68)' : 'rgba(20,20,20,.62)';
        if (params) {
          drawT(ctx, params, sx, cy, {
            size: it.size, weight: 400, color: ink, align: 'left',
            shadow: shadow, shadowBlur: it.size * 0.5, shadowY: it.size * 0.05
          });
        }
        if (date) {
          drawT(ctx, date, sx + pw + sw, cy, {
            size: it.size * 0.92, weight: 400, color: dim, align: 'left',
            shadow: shadow, shadowBlur: it.size * 0.5, shadowY: it.size * 0.05
          });
        }
      } else {
        drawT(ctx, it.text, g.iw / 2, cy, {
          size: it.size, weight: it.weight, color: ink, align: 'center',
          shadow: shadow, shadowBlur: it.size * 0.5, shadowY: it.size * 0.05
        });
      }

      if (i < items.length - 1) y += h + it.gap;
    });
  }

  function drawCorner(ctx, g) {
    var f = state.fields, ui = state.ui;
    var ink = autoInk();
    var shadow = ink === '#ffffff' ? 'rgba(0,0,0,.55)' : null;
    var name = deviceName();
    var params = paramsLine();
    var date = dateText();
    var sig = f.signature || '';
    var loc = locText();

    var pad = g.iw * 0.032;
    var l1 = g.iw * 0.021 * ui.font;
    var l2 = g.iw * 0.0165 * ui.font;
    var logoH = g.iw * 0.030 * ui.logoScale;
    var lw = logoW(logoH);

    var second = [params, loc].filter(Boolean).join('   ');
    var third = [date, sig].filter(Boolean).join('   ');
    var lineGap = l2 * 0.55;
    var h1 = Math.max(l1 * 1.2, logoH);
    var total = h1 + (second ? lineGap + l2 * 1.2 : 0) + (third ? lineGap + l2 * 1.2 : 0);
    var top = g.ih - pad - total;

    var x = pad;
    var cy1 = top + h1 / 2;
    if (lw) {
      drawLogo(ctx, x, cy1, logoH, 'left');
      x += lw + l1 * 0.55;
    }
    if (name) {
      drawT(ctx, name, x, cy1, {
        size: l1, weight: 650, color: ink,
        shadow: shadow, shadowBlur: l1 * 0.5, shadowY: l1 * 0.05
      });
    }

    var y = top + h1;
    if (second) {
      y += lineGap + l2 * 0.6;
      drawT(ctx, second, pad, y, {
        size: l2, weight: 400, color: ink,
        shadow: shadow, shadowBlur: l2 * 0.5, shadowY: l2 * 0.05
      });
      y += l2 * 0.6;
    }
    if (third) {
      y += lineGap + l2 * 0.6;
      drawT(ctx, third, pad, y, {
        size: l2 * 0.96, weight: 400, color: ink,
        shadow: shadow, shadowBlur: l2 * 0.5, shadowY: l2 * 0.05
      });
    }
  }

  function drawWordmark(ctx, g) {
    var f = state.fields, ui = state.ui;
    var ink = autoInk();
    var shadow = ink === '#ffffff' ? 'rgba(0,0,0,.5)' : null;
    var word = (f.brand || '').toUpperCase();
    var model = stripBrand(f.model, f.brand);
    var sig = f.signature || '';
    var date = dateText();

    var wS = g.iw * 0.052 * ui.font;
    var mS = g.iw * 0.023 * ui.font;
    var sS = g.iw * 0.019 * ui.font;
    var dS = g.iw * 0.016 * ui.font;
    var sp = wS * 0.16;

    var lines = [];
    if (word) lines.push({ text: word, size: wS, weight: 700, spacing: sp, gap: wS * 0.30 });
    if (model) lines.push({ text: model, size: mS, weight: 500, gap: mS * 0.55 });
    if (sig) lines.push({ text: sig, size: sS, weight: 400, gap: sS * 0.5 });
    if (date) lines.push({ text: date, size: dS, weight: 400, gap: dS * 0.3 });

    var total = 0;
    lines.forEach(function (l) { total += l.size * 1.15 + l.gap; });
    var y = g.ih - g.ih * 0.055 - total;

    lines.forEach(function (l) {
      var h = l.size * 1.15;
      drawT(ctx, l.text, g.iw / 2, y + h / 2, {
        size: l.size, weight: l.weight, color: ink, align: 'center', spacing: l.spacing || 0,
        shadow: shadow, shadowBlur: l.size * 0.5, shadowY: l.size * 0.04
      });
      y += h + l.gap;
    });
  }

  function drawFilm(ctx, g, b, bb) {
    var f = state.fields, ui = state.ui;
    var ink = '#1c1a16', sub = 'rgba(28,26,22,.55)';
    var name = deviceName();
    var params = paramsLine();
    var date = dateText();
    var loc = locText();
    var sig = f.signature || '';

    var s1 = g.iw * 0.0175 * ui.font;
    var s2 = g.iw * 0.0142 * ui.font;
    var cy = g.ih + b + bb / 2;
    var left = b, right = b + g.iw;
    var y1 = cy - bb * 0.11;
    var y2 = cy + bb * 0.11;

    var logoH = s1 * 1.5 * ui.logoScale;
    var lw = logoW(logoH);
    var x = left;
    if (lw) {
      drawLogo(ctx, x, y1, logoH, 'left');
      x += lw + s1 * 0.5;
    }
    if (name) drawT(ctx, name, x, y1, { size: s1, weight: 500, color: ink });
    if (params) drawT(ctx, params, right, y1, { size: s2, weight: 500, color: ink, align: 'right' });

    var l2 = [date, loc].filter(Boolean).join('   ');
    if (l2) drawT(ctx, l2, left, y2, { size: s2, weight: 400, color: sub });
    if (sig) drawT(ctx, sig, right, y2, { size: s2 * 0.96, weight: 400, color: sub, align: 'right' });
  }

  /* ================= 6. 渲染入口 ================= */
  function renderInto(canvas, targetW) {
    var bmp = state.bitmap;
    var ui = state.ui;
    var k = targetW / bmp.width;
    var iw = Math.max(1, Math.round(bmp.width * k));
    var ih = Math.max(1, Math.round(bmp.height * k));
    var tpl = state.template;

    var bd = 0, barH = 0, cw = iw, ch = ih;
    if (tpl === 'bar' || tpl === 'dark') {
      bd = Math.round(iw * ui.border);
      barH = Math.max(8, Math.round(iw * ui.bar));
      cw = iw + bd * 2;
      ch = ih + bd * 2 + barH;
    } else if (tpl === 'film') {
      bd = Math.round(iw * 0.045);
      var bb = Math.round(iw * 0.13);
      cw = iw + bd * 2;
      ch = ih + bd + bb;
    }

    canvas.width = cw;
    canvas.height = ch;
    var ctx = canvas.getContext('2d');
    ctx.imageSmoothingQuality = 'high';

    if (tpl === 'bar' || tpl === 'dark') {
      ctx.fillStyle = tpl === 'bar' ? '#ffffff' : '#0b0b0c';
      ctx.fillRect(0, 0, cw, ch);
      ctx.drawImage(bmp, bd, bd, iw, ih);
      drawBar(ctx, { tpl: tpl, iw: iw, ih: ih, bd: bd, barH: barH, cw: cw, ch: ch, barTop: bd + ih });
    } else if (tpl === 'center') {
      ctx.drawImage(bmp, 0, 0, iw, ih);
      drawCenter(ctx, { iw: iw, ih: ih });
    } else if (tpl === 'corner') {
      ctx.drawImage(bmp, 0, 0, iw, ih);
      drawCorner(ctx, { iw: iw, ih: ih });
    } else if (tpl === 'wordmark') {
      ctx.drawImage(bmp, 0, 0, iw, ih);
      drawWordmark(ctx, { iw: iw, ih: ih });
    } else if (tpl === 'film') {
      var bb2 = ch - ih - bd;
      ctx.fillStyle = '#f6f3ec';
      ctx.fillRect(0, 0, cw, ch);
      ctx.drawImage(bmp, bd, bd, iw, ih);
      drawFilm(ctx, { iw: iw, ih: ih }, bd, bb2);
    }
    return { w: cw, h: ch };
  }

  var rafId = 0;
  function scheduleRender() {
    if (!state.bitmap) return;
    if (rafId) return;
    rafId = requestAnimationFrame(function () {
      rafId = 0;
      try { renderInto(el.preview, Math.min(state.bitmap.width, 1600)); }
      catch (e) { console.error(e); toast('渲染出错：' + e.message); }
    });
  }

  /* ================= 7. 预设 ================= */
  function readStore(key) {
    try {
      var s = localStorage.getItem(key);
      return s ? JSON.parse(s) : null;
    } catch (e) { return null; }
  }

  function writeStore(key, val) {
    try {
      localStorage.setItem(key, JSON.stringify(val));
      return true;
    } catch (e) {
      toast('本地存储不可用或已满，建议导出备份');
      return false;
    }
  }

  function snapshot() {
    return clone({
      template: state.template,
      fields: state.fields,
      ui: state.ui,
      logo: state.logo,
      logoKind: state.logoKind
    });
  }

  function loadPresets() {
    var list = readStore(STORE_PRESET);
    state.presets = Array.isArray(list) ? list : [];
    renderPresetSelect();
  }

  function savePresets() {
    writeStore(STORE_PRESET, state.presets);
    renderPresetSelect();
  }

  function renderPresetSelect() {
    var sel = $('#presetSel');
    var html = '<option value="">（当前未保存）</option>';
    state.presets.forEach(function (p) {
      html += '<option value="' + esc(p.id) + '">' + esc(p.name) + '</option>';
    });
    sel.innerHTML = html;
    sel.value = state.currentPresetId || '';
    $('#presetCount').textContent = state.presets.length ? state.presets.length + ' 个' : '暂无';
  }

  function uid() {
    return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }

  function applyData(d) {
    if (!d) return;
    state.template = d.template || 'bar';
    state.fields = Object.assign(clone(DEF_FIELDS), d.fields || {});
    state.ui = Object.assign(clone(DEF_UI), d.ui || {});
    state.logo = d.logo || null;
    state.logoKind = d.logoKind || '';

    var done = function () {
      syncControls();
      updateMeta();
      scheduleRender();
      autosave();
    };

    if (state.logo && !state.logoKind) {
      loadImage(state.logo).then(function (img) {
        state.logoImg = img;
        done();
      }).catch(function () {
        state.logo = null;
        state.logoImg = null;
        done();
      });
    } else {
      state.logoImg = null;
      done();
    }
  }

  var autoTimer = 0;
  function autosave() {
    clearTimeout(autoTimer);
    autoTimer = setTimeout(function () {
      writeStore(STORE_AUTO, snapshot());
    }, 500);
  }

  function presetSave(asNew) {
    var sel = $('#presetSel');
    var name;
    if (!asNew && state.currentPresetId) {
      var p = state.presets.filter(function (x) { return x.id === state.currentPresetId; })[0];
      if (p) {
        p.data = snapshot();
        p.updatedAt = Date.now();
        savePresets();
        toast('已更新预设「' + p.name + '」');
        return;
      }
    }
    name = window.prompt('预设名称', state.fields.model || '我的预设');
    if (!name) return;
    var item = { id: uid(), name: name.trim(), data: snapshot(), createdAt: Date.now() };
    state.presets.push(item);
    state.currentPresetId = item.id;
    savePresets();
    toast('已保存预设「' + item.name + '」');
  }

  function presetDelete() {
    if (!state.currentPresetId) { toast('先在下拉框选一个预设'); return; }
    var p = state.presets.filter(function (x) { return x.id === state.currentPresetId; })[0];
    if (!p) return;
    if (!window.confirm('删除预设「' + p.name + '」？')) return;
    state.presets = state.presets.filter(function (x) { return x.id !== p.id; });
    state.currentPresetId = '';
    savePresets();
    toast('已删除');
  }

  function presetRename() {
    if (!state.currentPresetId) { toast('先在下拉框选一个预设'); return; }
    var p = state.presets.filter(function (x) { return x.id === state.currentPresetId; })[0];
    if (!p) return;
    var n = window.prompt('重命名预设', p.name);
    if (!n) return;
    p.name = n.trim();
    savePresets();
    toast('已重命名');
  }

  function presetExport() {
    if (!state.presets.length) { toast('还没有预设'); return; }
    var blob = new Blob([JSON.stringify({ version: 1, presets: state.presets }, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'exif-watermark-presets.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 3000);
    toast('已导出 ' + state.presets.length + ' 个预设');
  }

  function presetImport(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var data = JSON.parse(reader.result);
        var list = Array.isArray(data) ? data : (data.presets || []);
        var n = 0;
        list.forEach(function (p) {
          if (!p || !p.data) return;
          state.presets.push({ id: uid(), name: p.name || '导入预设', data: p.data, createdAt: Date.now() });
          n++;
        });
        savePresets();
        toast(n ? '已导入 ' + n + ' 个预设' : '文件里没有预设');
      } catch (e) {
        toast('导入失败：不是有效的 JSON');
      }
    };
    reader.readAsText(file);
  }

  /* ================= 8. 载入图片 ================= */
  function loadBlob(blob, name) {
    if (!blob) return;
    var type = (blob.type || '').toLowerCase();
    if (type && ['image/jpeg', 'image/png', 'image/webp'].indexOf(type) === -1) {
      toast('只支持 JPG / PNG / WebP');
      return;
    }
    readArrayBuffer(blob).then(function (buf) {
      var exif = parseExif(buf);
      return createBitmap(blob).then(function (bmp) {
        bmp = normalizeOrientation(bmp, exif.orientation);
        state.bitmap = bmp;
        state.file = blob;
        state.fileName = name || 'image';
        applyExif(exif);
        el.empty.hidden = true;
        el.preview.hidden = false;
        el.meta.hidden = false;
        el.exportBtn.disabled = false;
        el.exportBtn2.disabled = false;
        updateMeta();
        scheduleRender();
        autosave();
        toast('已载入 ' + bmp.width + ' × ' + bmp.height);
      });
    }).catch(function (e) {
      console.error(e);
      toast('这张图打不开，换一张试试');
    });
  }

  function createBitmap(blob) {
    if (window.createImageBitmap) {
      return createImageBitmap(blob, { imageOrientation: 'none' }).catch(function () {
        return createBitmapViaImg(blob);
      });
    }
    return createBitmapViaImg(blob);
  }

  // 老内核不会自动按 EXIF 转正，这里统一手动处理
  function normalizeOrientation(img, o) {
    if (!o || o < 2 || o > 8) return img;
    var w = img.width, h = img.height;
    var swap = o >= 5;
    var c = makeCanvas(swap ? h : w, swap ? w : h);
    var x = c.getContext('2d');
    switch (o) {
      case 2: x.transform(-1, 0, 0, 1, w, 0); break;
      case 3: x.transform(-1, 0, 0, -1, w, h); break;
      case 4: x.transform(1, 0, 0, -1, 0, h); break;
      case 5: x.transform(0, 1, 1, 0, 0, 0); break;
      case 6: x.transform(0, 1, -1, 0, h, 0); break;
      case 7: x.transform(0, -1, -1, 0, h, w); break;
      case 8: x.transform(0, -1, 1, 0, 0, w); break;
    }
    x.drawImage(img, 0, 0);
    return c;
  }

  function createBitmapViaImg(blob) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(blob);
      var img = new Image();
      img.onload = function () { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('decode failed')); };
      img.src = url;
    });
  }

  function applyExif(exif) {
    var f = state.fields;
    // 换图时先清空，避免上一张的值残留；没有的字段就留空让用户手填
    f.brand = exif.make || '';
    f.model = exif.model ? stripBrand(exif.model, exif.make) : '';
    f.focal = exif.focal || '';
    f.aperture = exif.aperture || '';
    f.shutter = exif.shutter || '';
    f.iso = exif.iso || '';
    f.date = exif.date || '';
    f.location = exif.gps ? fmtGps(exif.gps) : '';
    state.count = ['focal', 'aperture', 'shutter', 'iso', 'date'].filter(function (k) { return f[k]; }).length;
    syncControls();
  }

  function updateMeta() {
    var b = state.bitmap;
    if (!b) return;
    var filled = ['brand', 'model', 'focal', 'aperture', 'shutter', 'iso', 'date'].filter(function (k) {
      return state.fields[k];
    }).length;
    var parts = [
      state.fileName,
      b.width + '×' + b.height,
      filled ? ('已读取 ' + filled + ' 项参数') : '未检测到 EXIF，可手动填写'
    ];
    el.meta.innerHTML = parts.map(function (t, i) {
      if (i === 2) return '<span class="' + (filled ? 'ok' : '') + '">' + esc(t) + '</span>';
      return '<span>' + esc(t) + '</span>';
    }).join('<span class="sep">·</span>');
  }

  /* ================= 9. 控件同步与绑定 ================= */
  function syncControls() {
    $$('[data-f]').forEach(function (input) {
      input.value = state.fields[input.dataset.f] || '';
    });
    $$('.tpl').forEach(function (b) {
      b.classList.toggle('is-on', b.dataset.tpl === state.template);
    });
    $$('[data-show]').forEach(function (n) {
      var list = n.dataset.show.split(',');
      n.style.display = list.indexOf(state.template) >= 0 ? '' : 'none';
    });
    $('#dateSw').checked = !!state.ui.showDate;
    $('#locSw').checked = !!state.ui.showLoc;

    setRange('#bar', state.ui.bar * 100, '#barOut', '%', 1);
    setRange('#border', state.ui.border * 100, '#borderOut', '%', 1);
    setRange('#logo', state.ui.logoScale * 100, '#logoOut', '%', 0);
    setRange('#font', state.ui.font * 100, '#fontOut', '%', 0);
    setRange('#quality', state.ui.quality * 100, '#qOut', '%', 0);

    $('#exportSize').value = String(state.ui.exportMax || 0);
    setRange('#pos', (state.ui.pos == null ? 75 : state.ui.pos), '#posOut', '', 0);
    $('#format').value = state.ui.format;
    $('#quality').disabled = state.ui.format === 'png';

    $$('#inkSeg button').forEach(function (b) {
      b.classList.toggle('on', b.dataset.v === state.ui.ink);
    });

    var activeKind = state.logoKind;
    $$('#logoChips .chip').forEach(function (b) {
      var on;
      if (b.id === 'logoPick') on = !!(state.logo && !activeKind);
      else if (b.dataset.kind) on = b.dataset.kind === activeKind;
      else on = !activeKind && !state.logo;
      b.classList.toggle('is-on', on);
    });
    $('#logoName').textContent = activeKind === 'leica' ? '预置：徕卡红点（透明 PNG）'
      : state.logo ? '自定义图标：' + (state.logoName || '已上传')
      : '未设置 · 用文字品牌名';
  }

  function setRange(sel, val, outSel, unit, digits) {
    var input = $(sel);
    input.value = val;
    $(outSel).textContent = (digits ? val.toFixed(digits) : Math.round(val)) + unit;
  }

  function pickTemplate(name) {
    state.template = name;
    syncControls();
    scheduleRender();
    autosave();
  }

  /* ---------- 事件 ---------- */
  el.stage.addEventListener('click', function (e) {
    if (!state.bitmap && e.target.closest('#empty')) el.file.click();
  });
  $('#pickBtn').addEventListener('click', function () { el.file.click(); });

  el.file.addEventListener('change', function () {
    var f = el.file.files && el.file.files[0];
    if (f) loadBlob(f, f.name);
    el.file.value = '';
  });

  ['dragenter', 'dragover'].forEach(function (t) {
    el.stage.addEventListener(t, function (e) { e.preventDefault(); el.stage.classList.add('drag'); });
  });
  ['dragleave', 'drop'].forEach(function (t) {
    el.stage.addEventListener(t, function (e) {
      e.preventDefault();
      if (t === 'dragleave' && e.target !== el.stage) return;
      el.stage.classList.remove('drag');
    });
  });
  el.stage.addEventListener('drop', function (e) {
    var f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) loadBlob(f, f.name);
  });
  window.addEventListener('paste', function (e) {
    var items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (var i = 0; i < items.length; i++) {
      if (items[i].type.indexOf('image/') === 0) {
        var f = items[i].getAsFile();
        if (f) { loadBlob(f, 'pasted.png'); break; }
      }
    }
  });

  $$('.tpl').forEach(function (b) {
    b.addEventListener('click', function () { pickTemplate(b.dataset.tpl); });
  });

  $$('[data-f]').forEach(function (input) {
    input.addEventListener('input', function () {
      state.fields[input.dataset.f] = input.value;
      scheduleRender();
      autosave();
    });
  });

  $('#dateSw').addEventListener('change', function (e) {
    state.ui.showDate = e.target.checked;
    scheduleRender();
    autosave();
  });
  $('#locSw').addEventListener('change', function (e) {
    state.ui.showLoc = e.target.checked;
    scheduleRender();
    autosave();
  });

  $('#reloadBtn').addEventListener('click', function () {
    if (!state.file) { toast('先选一张图'); return; }
    readArrayBuffer(state.file).then(function (buf) {
      applyExif(parseExif(buf));
      scheduleRender();
      autosave();
      toast('已按原图 EXIF 重置');
    });
  });

  $('#bar').addEventListener('input', function (e) {
    state.ui.bar = parseFloat(e.target.value) / 100;
    $('#barOut').textContent = e.target.value + '%';
    scheduleRender(); autosave();
  });
  $('#border').addEventListener('input', function (e) {
    state.ui.border = parseFloat(e.target.value) / 100;
    $('#borderOut').textContent = e.target.value + '%';
    scheduleRender(); autosave();
  });
  $('#logo').addEventListener('input', function (e) {
    state.ui.logoScale = parseFloat(e.target.value) / 100;
    $('#logoOut').textContent = e.target.value + '%';
    scheduleRender(); autosave();
  });
  $('#pos').addEventListener('input', function (e) {
    state.ui.pos = parseInt(e.target.value, 10);
    $('#posOut').textContent = e.target.value;
    scheduleRender(); autosave();
  });
  $('#font').addEventListener('input', function (e) {
    state.ui.font = parseFloat(e.target.value) / 100;
    $('#fontOut').textContent = e.target.value + '%';
    scheduleRender(); autosave();
  });
  $('#quality').addEventListener('input', function (e) {
    state.ui.quality = parseFloat(e.target.value) / 100;
    $('#qOut').textContent = e.target.value + '%';
    autosave();
  });
  $('#exportSize').addEventListener('change', function (e) {
    state.ui.exportMax = parseInt(e.target.value, 10) || 0;
    autosave();
  });
  $('#format').addEventListener('change', function (e) {
    state.ui.format = e.target.value;
    $('#quality').disabled = state.ui.format === 'png';
    autosave();
  });

  $('#inkSeg').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    state.ui.ink = b.dataset.v;
    Array.prototype.forEach.call(this.children, function (c) { c.classList.toggle('on', c === b); });
    scheduleRender(); autosave();
  });

  /* 图标 */
  $('#logoChips').addEventListener('click', function (e) {
    var b = e.target.closest('.chip');
    if (!b) return;
    if (b.id === 'logoPick') { $('#logoFile').click(); return; }
    state.logoKind = b.dataset.kind || '';
    state.logo = null;
    state.logoImg = null;
    state.logoName = '';
    syncControls();
    scheduleRender();
    autosave();
  });
  $('#logoFile').addEventListener('change', function () {
    var f = this.files && this.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      state.logoKind = '';
      state.logo = reader.result;
      state.logoName = f.name;
      loadImage(state.logo).then(function (img) {
        state.logoImg = img;
        syncControls();
        scheduleRender();
        autosave();
        toast('图标已设置');
      }).catch(function () { toast('图标读不出来'); });
    };
    reader.readAsDataURL(f);
    this.value = '';
  });
  /* 预设 */
  $('#presetSel').addEventListener('change', function (e) {
    var id = e.target.value;
    state.currentPresetId = id;
    var p = state.presets.filter(function (x) { return x.id === id; })[0];
    if (p) applyData(p.data);
  });
  $('#presetSave').addEventListener('click', function () { presetSave(false); });
  $('#presetSaveAs').addEventListener('click', function () { presetSave(true); });
  $('#presetRename').addEventListener('click', presetRename);
  $('#presetDel').addEventListener('click', presetDelete);
  $('#presetExport').addEventListener('click', presetExport);
  $('#presetImport').addEventListener('click', function () { $('#presetFile').click(); });
  $('#presetFile').addEventListener('change', function () {
    var f = this.files && this.files[0];
    if (f) presetImport(f);
    this.value = '';
  });

  /* 导出 */
  function downloadBlob(blob, name) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  }

  function download() {
    if (!state.bitmap) return;
    var isPng = state.ui.format === 'png';
    var type = isPng ? 'image/png' : 'image/jpeg';
    var name = (state.fileName || 'image').replace(/\.[^.]+$/, '') + '-wm.' + (isPng ? 'png' : 'jpg');

    function pickHandle() {
      if (!window.showSaveFilePicker) return Promise.resolve(null);
      return window.showSaveFilePicker({
        suggestedName: name,
        startIn: 'desktop',
        types: isPng
          ? [{ description: 'PNG 图片', accept: { 'image/png': ['.png'] } }]
          : [{ description: 'JPEG 图片', accept: { 'image/jpeg': ['.jpg', '.jpeg'] } }]
      }).catch(function (e) {
        if (e && e.name === 'AbortError') return 'cancel';
        return null;
      });
    }

    pickHandle().then(function (handle) {
      if (handle === 'cancel') return;
      var btn = el.exportBtn2;
      var old = btn.textContent;
      btn.textContent = '导出中…';
      btn.disabled = true;
      var restore = function () { btn.textContent = old; btn.disabled = false; };

      return new Promise(function (r) { setTimeout(r, 30); })
        .then(function () {
          var c = makeCanvas(1, 1);
          var sw = state.bitmap.width, sh = state.bitmap.height;
          var longEdge = Math.max(sw, sh);
          var maxEdge = state.ui.exportMax || 0;
          var targetW = sw;
          if (maxEdge && longEdge > maxEdge) {
            targetW = Math.max(1, Math.round(sw * maxEdge / longEdge));
          }
          renderInto(c, Math.min(targetW, 8000));
          return new Promise(function (resolve) {
            if (c.toBlob) c.toBlob(resolve, type, isPng ? undefined : state.ui.quality);
            else resolve(null);
          }).then(function (blob) { return { blob: blob, canvas: c }; });
        })
        .then(function (res) {
          var blob = res.blob;
          if (!blob) { toast('导出失败，试试换 PNG'); return; }
          if (handle) {
            return handle.createWritable().then(function (w) {
              return w.write(blob).then(function () { return w.close(); });
            }).then(function () {
              toast('已保存：' + handle.name);
            });
          }
          downloadBlob(blob, name);
          toast('已保存：' + name);
        })
        .catch(function (e) {
          console.error(e);
          toast('保存失败：' + (e.message || e.name));
        })
        .then(restore, restore);
    });
  }
  el.exportBtn.addEventListener('click', download);
  el.exportBtn2.addEventListener('click', download);

  document.addEventListener('keydown', function (e) {
    var mod = e.ctrlKey || e.metaKey;
    if (!mod) return;
    if (e.key.toLowerCase() === 'o') { e.preventDefault(); el.file.click(); }
    else if (e.key.toLowerCase() === 's') { e.preventDefault(); download(); }
  });

  /* ================= 10. 启动 ================= */
  window.__setDemo = function (dataUri, tpl) {
    if (tpl) pickTemplate(tpl);
    var m = /^data:([^;]+);base64,(.*)$/.exec(dataUri);
    if (!m) return;
    var bin = atob(m[2]);
    var arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    loadBlob(new Blob([arr], { type: m[1] }), 'demo.jpg');
  };

  function boot() {
    if (window.__DEMO_CLEAN__) document.body.classList.add('clean');
    if (window.__DEMO_IMAGE__) {
      var st = document.createElement('style');
      st.textContent = '*{transition:none!important;animation:none!important}';
      document.head.appendChild(st);
    }
    loadImage(LEICA_SRC).then(function (img) {
      leicaImg = img;
      scheduleRender();
    }).catch(function () {});
    loadPresets();
    var auto = window.__DEMO_IMAGE__ ? null : readStore(STORE_AUTO);
    if (auto && auto.fields) {
      applyData(auto);
    } else {
      syncControls();
    }
    if (window.__DEMO_IMAGE__) {
      if (window.__DEMO_LOGO__) state.logoKind = window.__DEMO_LOGO__;
      setTimeout(function () { window.__setDemo(window.__DEMO_IMAGE__, window.__DEMO_TEMPLATE__); }, 30);
    }
  }

  boot();
})();
</script>
</body>
</html>
